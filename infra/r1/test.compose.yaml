name: agentanywhere-r1-test
services:
  web:
    image: agentanywhere-r1-web:r1-05
    ports: ["127.0.0.1:19112:3000"]
    env_file: ./test.env
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      AGENTANYWHERE_HOST: 0.0.0.0
      AGENTANYWHERE_PORT: 3000
      AGENTANYWHERE_DATA_DIR: /data
      AGENTANYWHERE_ARTIFACT_DIR: /artifacts
    volumes: ["./test-data:/data", "./test-artifacts:/artifacts:ro"]
    networks:
      app: {}
      sandbox:
        aliases: [test-web]
  queue:
    image: agentanywhere-r1-queue:r1-05
    env_file: ./test.env
    depends_on:
      web:
        condition: service_healthy
    environment:
      AGENT_IMAGE: agentanywhere-r1-agent:r1-06
      OPEN_SANDBOX_DOMAIN: opensandbox:8080
      MODEL_PROXY_ORIGIN: http://test-web:3000
      SEARCH_ORIGIN: http://model-fixture:3002
      AGENTANYWHERE_ARTIFACT_DIR: /artifacts
      AGENTANYWHERE_PUBLIC_ORIGIN: ${TEST_CONTROL_PLANE_ORIGIN:-http://test-web:3000}
    volumes: ["./test-artifacts:/artifacts"]
    networks: [app, sandbox]
  model-fixture:
    image: agentanywhere-r1-model-fixture:r1-06
    ports: ["127.0.0.1:19113:3002"]
    networks:
      sandbox:
        aliases: [model-fixture]
networks:
  app:
    external: true
    name: agentanywhere-r1_default
  sandbox:
    external: true
    name: agentanywhere-r1-sandbox
