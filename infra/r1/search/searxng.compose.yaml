name: agentanywhere-r1-search
services:
  searxng:
    image: docker.io/searxng/searxng@sha256:6f04bb0211859d0c7ebc3deeb39531c038d876dbccc70ea0388c0dae09f9b5f3
    container_name: agentanywhere-r1-searxng
    restart: unless-stopped
    env_file:
      - ./searxng.env
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: "8080"
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - search
networks:
  search:
    name: agentanywhere-r1-search
    driver: bridge
